services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: adhd_app_postgres
    environment:
      POSTGRES_DB: tdah_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - adhd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adhd_app_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tdah_app
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tdah_app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adhd-network
    volumes:
      # Montar firebase-credentials.json se existir
      - ./src/main/resources/firebase-credentials.json:/app/firebase-credentials.json:ro
    restart: unless-stopped

networks:
  adhd-network:
    driver: bridge

volumes:
  postgres_data: