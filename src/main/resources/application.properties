spring.application.name=backend

# Server
server.port=8080

server.servlet.context-path=/api

server.servlet.max-http-header-size=8192
server.tomcat.max-connections=200
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.compression.enabled=true
server.compression.min-response-size=1024

# Database
# Banco local
#spring.datasource.url=jdbc:postgresql://localhost:5432/tdah_app
# Banco em rede do servidor (CasaOs)
spring.datasource.url=jdbc:postgresql://192.168.15.11:5432/tdah_app

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:porta256}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true
spring.flyway.outOfOrder=false
spring.flyway.validate-on-migrate=true
logging.level.org.flywaydb=DEBUG

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# JWT
app.jwtSecret=${JWT_SECRET:TMCFwmm4gyyDM0S6gcy9LZeniubtt6PvLuAVCSp/I3qzG11GhmqrvKYs4pKmezinNk/NKNvtkfHN0U6LnWZY1g==}
app.jwtExpirationMs=900000
app.jwtRefreshExpirationMs=604800000
app.jwt.header-name=Authorization
app.jwt.token-prefix=Bearer
app.jwt.token-refresh-threshold-ms=60000

# Firebase
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:src/main/resources/firebase-credentials.json}

# Scheduling
spring.task.scheduling.thread-name-prefix=adhd-scheduler-

# Logging
logging.level.root=WARN
logging.level.adhd.task.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/adhd-app.log

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

